site_name: 3DRD NextFTC Quickstart
site_description: Requirements, architecture, reconstruction, and operating guidance for the 3DRD FTC robot platform
site_url: https://3droboticsduluth.github.io/NextFTC-Quickstart/
repo_url: https://github.com/3DRoboticsDuluth/NextFTC-Quickstart
repo_name: 3DRoboticsDuluth/NextFTC-Quickstart
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - Get started:
      - Welcome: index.md
      - Start a new season: guides/new-season.md
      - Why Kotlin?: guides/why-kotlin.md
      - Choose drivetrain and localization: guides/drivetrain.md
      - Build the first robot: guides/first-robot.md
      - Hardware worksheet: guides/hardware-worksheet.md
      - Add a servo subsystem: guides/subsystem.md
      - Add a motor and sensor subsystem: guides/motor-subsystem.md
      - Deploy robot code: guides/deployment.md
      - Build autonomous behavior: guides/autonomous.md
      - Document your robot: guides/document-your-robot.md
      - Write implementable requirements: guides/implementable-requirements.md
      - Worked requirements example: guides/requirements-example.md
  - Our robot:
      - Overview: robot/index.md
      - Requirements: robot/requirements.md
      - Architecture and subsystems: robot/architecture.md
      - Validation: robot/validation.md
      - Decode and Osiris: requirements/decode-osiris.md
      - Osiris system specification: requirements/osiris-system.md
      - Osiris mechanisms: requirements/osiris-mechanisms.md
      - Osiris navigation and vision: requirements/osiris-navigation-vision.md
      - Osiris autonomous: requirements/osiris-autonomous.md
      - Traceability: requirements/traceability.md
      - Hardware and controls: reference/hardware-controls.md
  - Platform reference:
      - Overview: reference/platform.md
      - Architecture:
          - architecture/overview.md
          - Lifecycle: architecture/lifecycle.md
          - Commands: architecture/commands.md
          - Configuration: architecture/configuration.md
          - Telemetry and logging: architecture/diagnostics.md
          - Hardware: architecture/hardware.md
          - Drive and navigation: architecture/drive-navigation.md
          - Quanomous: architecture/quanomous.md
      - Requirements:
          - requirements/index.md
          - FTC foundation: requirements/foundation.md
          - Reusable platform: requirements/platform.md
          - Seasonal scaffold: requirements/seasonal-base.md
      - Rebuild:
          - rebuild/index.md
          - Phase 1: rebuild/phase-1.md
          - Phase 2: rebuild/phase-2.md
          - Verification: rebuild/verification.md
          - Phase 3 — Decode and Osiris: rebuild/phase-3.md
          - One-shot clean-room rebuild: rebuild/one-shot.md
      - Reference:
          - Modules and dependencies: reference/modules-dependencies.md
          - BIOBUZZ upgrade review: reference/season-upgrades-review.md
          - Upstream resources: reference/upstream.md
          - Settings: reference/settings.md
          - Decisions: reference/decisions.md
          - Glossary: reference/glossary.md
          - Project context: project-context.md
