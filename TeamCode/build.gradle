buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url = uri('https://repo.dairy.foundation/releases') }
    }
    dependencies {
        classpath 'dev.frozenmilk:Load:0.3.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'jacoco'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

jacoco {
    toolVersion = '0.8.14'
}

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply from: '../gradle/robot-deployment.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    compileSdk 34

    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

repositories {
    maven { url = uri('https://repo.dairy.foundation/releases') }
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.bylazar:fullpanels') using module(
            'com.bylazar.sloth:fullpanels:0.3.2+1.0.13'
        )
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation project(':3drdNextFTC')
    implementation project(':3drdQuanomous')
    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-reflect:2.4.10'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}

tasks.withType(Test).configureEach {
    doFirst {
        def agent = classpath.files.find { it.name.startsWith('mockito-core') }
        if (agent) {
            jvmArgs "-javaagent:${agent.absolutePath}"
        }
    }
}

def teamCodeClasses = fileTree("$buildDir/tmp/kotlin-classes/debug") {
    exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class',
        '**/*$DefaultImpls.class', '**/*Test*.*'
}
def teamCodeSources = files('src/main/java')
def unitTestExecutionData = fileTree(buildDir) {
    include 'jacoco/testDebugUnitTest.exec'
}

tasks.register('unitTestCoverage', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        html.required = true
        xml.required = true
    }

    classDirectories.setFrom(teamCodeClasses)
    sourceDirectories.setFrom(teamCodeSources)
    executionData.setFrom(unitTestExecutionData)
}

tasks.register('verifyUnitTestCoverage', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(teamCodeClasses)
    sourceDirectories.setFrom(teamCodeSources)
    executionData.setFrom(unitTestExecutionData)

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

tasks.named('check').configure { dependsOn 'verifyUnitTestCoverage' }
